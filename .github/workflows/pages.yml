name: Deploy Playground to GitHub Pages

# Deployed since v0.3.0: https://ybtiger107.github.io/palembang-graphic-system/
# GitHub Pages is enabled (Settings -> Pages -> Source: GitHub Actions); see
# implementations/web/README.md for the deployed site structure.

on:
  push:
    branches: [main]
    paths:
      - "implementations/web/**"
      - "tokens/palembang.v1.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run Playground unit tests
        run: node --test implementations/web/test/

      - name: Assemble static site
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          # Copy the Playground source as the Pages site root so it works
          # under the /palembang-graphic-system/ project-site base path.
          cp -r implementations/web/. dist/
          rm -rf dist/test dist/package.json
          # Co-locate a copy of the canonical tokens next to the deployed
          # page; palembang.js's loadTokens() tries this path first. See
          # implementations/web/README.md ("Token loading on GitHub Pages").
          mkdir -p dist/tokens
          cp tokens/palembang.v1.json dist/tokens/palembang.v1.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
